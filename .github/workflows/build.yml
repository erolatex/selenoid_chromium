name: Build and Push Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check_chromium_version:
    runs-on: ubuntu-22.04
    outputs:
      build_required: ${{ steps.check_image.outputs.build_required }}
      short_version: ${{ steps.get_chromium_version.outputs.short_version }}
    steps:
      - name: Set up environment
        shell: bash
        run: |
          # Use non-interactive APT to avoid hangs
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends software-properties-common jq curl
          # Add xtradeb/apps PPA and refresh package lists
          sudo add-apt-repository -y ppa:xtradeb/apps
          sudo apt-get update -yq

      - name: Check Chromium Version
        id: get_chromium_version
        shell: bash
        run: |
          # Determine Chromium candidate version (what apt would actually install)
          PACKAGE="chromium"
          VERSION=$(apt-cache policy "$PACKAGE" | awk '/Candidate:/ {print $2}')
          if [[ -z "$VERSION" || "$VERSION" == "(none)" ]]; then
            echo "Chromium version not found for package $PACKAGE" >&2
            exit 1
          fi

          # Tag format: major.minor
          SHORT_VERSION=$(awk -F '.' '{print $1 "." $2}' <<< "$VERSION")
          if [[ -z "$SHORT_VERSION" ]]; then
            echo "Failed to calculate short_version from $VERSION" >&2
            exit 1
          fi

          echo "Chromium package: $PACKAGE"
          echo "Chromium full version: $VERSION"
          echo "Chromium short version: $SHORT_VERSION"

          # Export output (modern way)
          echo "short_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Image on Docker Hub
        id: check_image
        shell: bash
        run: |
          # Verify the tag existence on Docker Hub with a simple HTTP status check
          IMAGE_TAG='${{ steps.get_chromium_version.outputs.short_version }}'
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "short_version is empty, aborting" >&2
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/erolatex/selenoid_chromium/tags/${IMAGE_TAG}/")

          if [[ "$STATUS" == "404" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == "200" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP status from Docker Hub: $STATUS" >&2
            exit 1
          fi

  build_and_push:
    needs: check_chromium_version
    runs-on: ubuntu-latest
    if: needs.check_chromium_version.outputs.build_required == 'true'
    environment: DOCKERHUB
    steps:
      - name: Clone Dockerfile Repository
        uses: actions/checkout@v4
        with:
          repository: erolatex/images
          path: dockerfile_repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        shell: bash
        run: |
          # Guard against empty tag
          TAG='${{ needs.check_chromium_version.outputs.short_version }}'
          if [[ -z "$TAG" ]]; then
            echo "TAG is empty, aborting" >&2
            exit 1
          fi

          cd dockerfile_repo/static/chromium
          docker buildx build --no-cache \
            --build-arg BASE_IMAGE_TAG=1.0.1 \
            --platform linux/amd64,linux/arm64 \
            -t erolatex/selenoid_chromium:"$TAG" \
            -t erolatex/selenoid_chromium:latest \
            --push .

      - name: Log out from Docker Hub
        run: docker logout
