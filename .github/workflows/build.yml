name: Build and Push Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check_chromium_version:
    runs-on: ubuntu-22.04
    outputs:
      build_required: ${{ steps.check_image.outputs.build_required }}
      short_version: ${{ steps.get_chromium_version.outputs.short_version }}
    steps:
      - name: Set up environment
        shell: bash
        run: |
          # Minimal tools; non-interactive to avoid hangs
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends curl jq

      - name: Check Chromium Version
        id: get_chromium_version
        shell: bash
        run: |
          set -euo pipefail

          # Read pool listing and extract versions that explicitly target 22.04
          URL="https://ppa.launchpadcontent.net/xtradeb/apps/ubuntu/pool/main/c/chromium/"
          HTML="$(curl -fsSL "$URL")" || { echo "Failed to fetch $URL" >&2; exit 1; }

          # Match filenames like chromium_141.0.7390.54-<anything>2204<anything>.<ext>
          # Capture ONLY the numeric version before the first hyphen.
          mapfile -t VERSIONS_2204 < <(printf '%s' "$HTML" \
            | grep -oP 'chromium_\K[0-9]+(?:\.[0-9]+){3}(?=-[^"<>]*2204)' \
            | sort -V | uniq)

          if (( ${#VERSIONS_2204[@]} == 0 )); then
            echo "No chromium builds for 22.04 found in pool listing" >&2
            echo "Pool URL checked: $URL" >&2
            exit 1
          fi

          VERSION="${VERSIONS_2204[-1]}"

          # Short tag = major.minor
          SHORT_VERSION="$(awk -F '.' '{print $1 "." $2}' <<< "$VERSION")"
          if [[ -z "$SHORT_VERSION" ]]; then
            echo "Failed to compute short_version from $VERSION" >&2
            exit 1
          fi

          echo "Chromium full version: $VERSION"
          echo "Chromium short version: $SHORT_VERSION"

          echo "short_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Image on Docker Hub
        id: check_image
        shell: bash
        run: |
          TAG='${{ steps.get_chromium_version.outputs.short_version }}'
          if [[ -z "$TAG" ]]; then
            echo "short_version is empty, aborting" >&2
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/erolatex/selenoid_chromium/tags/${TAG}/")

          if [[ "$STATUS" == "404" ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == "200" ]]; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected HTTP status from Docker Hub: $STATUS" >&2
            exit 1
          fi

  build_and_push:
    needs: check_chromium_version
    runs-on: ubuntu-latest
    if: needs.check_chromium_version.outputs.build_required == 'true'
    environment: DOCKERHUB
    steps:
      - name: Clone Dockerfile Repository
        uses: actions/checkout@v4
        with:
          repository: erolatex/images
          path: dockerfile_repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        shell: bash
        run: |
          TAG='${{ needs.check_chromium_version.outputs.short_version }}'
          if [[ -z "$TAG" ]]; then
            echo "TAG is empty, aborting" >&2
            exit 1
          fi

          cd dockerfile_repo/static/chromium
          docker buildx build --no-cache \
            --build-arg BASE_IMAGE_TAG=1.0.1 \
            --platform linux/amd64,linux/arm64 \
            -t erolatex/selenoid_chromium:"$TAG" \
            -t erolatex/selenoid_chromium:latest \
            --push .

      - name: Log out from Docker Hub
        run: docker logout
